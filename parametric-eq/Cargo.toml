[package]
name = "parametric-eq"
version = "1.0.0"
edition = "2021"
description = "High-quality stereo parametric EQ for WAV files, minimum-phase or linear-phase"
license = "MIT"
readme = "README.md"
rust-version = "1.74"

[[bin]]
name = "parametric-eq"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
